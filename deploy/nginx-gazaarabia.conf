# ==============================================================================
# Gazaarabia Production Nginx Configuration
# High-Performance Reverse Proxy for Next.js with Cloudflare Edge CDN Integration
# ==============================================================================

# Upstream pool with persistent TCP keepalive connections to Node.js / PM2
upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64; # Eliminates socket churn & shaves 10-20ms per proxy request
}

# Upstream for GitHub automatic deployment webhook
upstream webhook_upstream {
    server 127.0.0.1:9000;
    keepalive 8;
}

# ------------------------------------------------------------------------------
# HTTP -> HTTPS Redirect Server Block
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name gazaarabia.com www.gazaarabia.com;

    # Let's Encrypt ACME challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Redirect all HTTP traffic to HTTPS permanently
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS Primary Server Block (HTTP/2, TLS 1.3, Edge Optimized)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gazaarabia.com www.gazaarabia.com;

    # Root directory for static fallbacks
    root /var/www/Gazaarabia;

    # SSL / TLS Configuration
    ssl_certificate /etc/letsencrypt/live/gazaarabia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gazaarabia.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Caching (0-RTT TLS Session Resumption across high latency links)
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # SSL buffer size: 4k (reduces Time-To-First-Byte on slow mobile links)
    ssl_buffer_size 4k;

    # TCP / Latency Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    reset_timedout_connection on;
    client_max_body_size 50M;

    # --------------------------------------------------------------------------
    # Cloudflare Real IP Restoration (Uncomment if using Cloudflare Proxy)
    # --------------------------------------------------------------------------
    include /etc/nginx/conf.d/cloudflare-ips.conf;

    # --------------------------------------------------------------------------
    # Compression: Gzip & Precompressed Brotli / Gzip Static files
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # Enable precompressed static file delivery (.gz and .br)
    gzip_static on;
    # brotli_static on; # Uncomment if ngx_http_brotli_module is installed on VPS

    # --------------------------------------------------------------------------
    # Static Assets Direct Disk Serving (Bypasses Node.js completely)
    # --------------------------------------------------------------------------

    # Next.js immutable static build assets (JS, CSS chunks)
    location /_next/static/ {
        alias /var/www/Gazaarabia/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip_static on;
        # brotli_static on;
        try_files $uri @node_proxy;
    }

    # Public image and media uploads (Product pictures, banner assets)
    location /uploads/ {
        alias /var/www/Gazaarabia/public/uploads/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        try_files $uri @node_proxy;
    }

    location /images/ {
        alias /var/www/Gazaarabia/public/images/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        try_files $uri @node_proxy;
    }

    # Static font and icon caching
    location ~* \.(?:ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf|eot)$ {
        root /var/www/Gazaarabia/public;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @node_proxy;
    }

    # --------------------------------------------------------------------------
    # CI/CD Webhook Proxy (GitHub Deployment Listener)
    # --------------------------------------------------------------------------
    location /api/webhook/github {
        proxy_pass http://webhook_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # Fallback Named Location for Node.js
    # --------------------------------------------------------------------------
    location @node_proxy {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection ""; # Clear Connection header for keepalive pool
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # --------------------------------------------------------------------------
    # Next.js Application Proxy (SSR, Dynamic Pages, API Routes)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;

        # Keepalive to Node upstream: must reset Connection header
        proxy_set_header Connection "";

        # Standard forward headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support (for Next.js HMR or real-time features)
        proxy_set_header Upgrade $http_upgrade;

        # Proxy buffer optimization to eliminate disk buffering for responses
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Timeouts
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
