services:
  mysql:
    image: mysql:8.0
    container_name: gazaarabia-mysql
    restart: unless-stopped
    command: --lower-case-table-names=1 --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gazaarabia
      MYSQL_USER: gaza_user
      MYSQL_PASSWORD: gaza_pass123
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
